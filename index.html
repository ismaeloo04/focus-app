<meta name="apple-mobile-web-app-title" content="Focus">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap">
<style>
/* Graficoo palette & type (same tokens as the Graficoo Studio app). */
:root {
  --bg: #F0F1F1; --surface: #FFFFFF; --surface-2: #F6F6F6; --ink: #141414; --muted: #6A6A6E; --line: #E2E2E3;
  --red: #EE2E24; --red-ink: #C61F16; --red-soft: #FDEAE8;
  --ok: #1D7F47; --ok-soft: #E3F2E9; --warn: #9A5B00; --warn-soft: #FFF0D6;
  --bar: #FFFFFF; --bar-ink: #141414; --bar-muted: #6A6A6E; --bar-2: #F2F2F3; --bar-line: #E2E2E3; --shade: rgba(20,20,20,.45);
  --nc-red: #FDE3E0; --nc-amber: #FFF0D2; --nc-green: #E1F2E7; --nc-blue: #E3ECFB; --nc-purple: #EDE6FB; --nc-gray: #E9E9EA;
  --f-ui: "Montserrat", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-ar: "IBM Plex Sans Arabic", "Montserrat", system-ui, sans-serif;
  --f-display: "Alexandria", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --r-s: 10px; --r-m: 16px; --r-l: 22px; --glow: rgba(238,46,36,.4);
  --gut-l: max(16px, env(safe-area-inset-left, 0px)); --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E0E0E; --surface: #1A1A1A; --surface-2: #222222; --ink: #F1F1F1; --muted: #9D9DA1; --line: #2D2D2E;
  --red: #F0453B; --red-ink: #FF7A71; --red-soft: #3A1614;
  --ok: #55C985; --ok-soft: #142D1E; --warn: #F2AE48; --warn-soft: #33240C;
  --bar: #000000; --bar-ink: #FFFFFF; --bar-muted: #8A8A8E; --bar-2: #1C1C1C; --bar-line: #333; --shade: rgba(0,0,0,.6); color-scheme: dark;
  --nc-red: #3A1A17; --nc-amber: #34280F; --nc-green: #15301F; --nc-blue: #172439; --nc-purple: #251D38; --nc-gray: #2A2A2B;
} }
:root[data-theme="dark"] {
  --bg: #0E0E0E; --surface: #1A1A1A; --surface-2: #222222; --ink: #F1F1F1; --muted: #9D9DA1; --line: #2D2D2E;
  --red: #F0453B; --red-ink: #FF7A71; --red-soft: #3A1614;
  --ok: #55C985; --ok-soft: #142D1E; --warn: #F2AE48; --warn-soft: #33240C;
  --bar: #000000; --bar-ink: #FFFFFF; --bar-muted: #8A8A8E; --bar-2: #1C1C1C; --bar-line: #333; --shade: rgba(0,0,0,.6); color-scheme: dark;
  --nc-red: #3A1A17; --nc-amber: #34280F; --nc-green: #15301F; --nc-blue: #172439; --nc-purple: #251D38; --nc-gray: #2A2A2B;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ar); font-size: 15px; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-family: var(--f-ui); font-variant-numeric: tabular-nums; }
svg { flex: none; }
.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; background: var(--bar); color: var(--bar-ink);
  padding: calc(10px + env(safe-area-inset-top, 0px)) var(--gut-r) 10px var(--gut-l);
  display: flex; align-items: center; gap: 8px; border-bottom: 3px solid var(--red); }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--f-ui); font-weight: 800; font-size: 19px; letter-spacing: .02em; direction: ltr; }
.brand img { width: 30px; height: 30px; border-radius: 8px; display: block; }
.brand small { font-weight: 600; font-size: 10px; letter-spacing: .2em; color: var(--bar-muted); display: block; margin-top: -3px; }
.mk { display: block; width: 30px; height: 30px; background: var(--red); -webkit-mask: url(icons/mark.png) center / contain no-repeat; mask: url(icons/mark.png) center / contain no-repeat; }
.mk.big { width: 64px; height: 64px; }
.top .sp { flex: 1; }
.tb { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--bar-line, #333); background: var(--bar-2); color: var(--bar-ink); display: grid; place-items: center; padding: 0; }
.tb[aria-current="page"] { background: var(--red); border-color: var(--red); }
.tb .i { width: 18px; height: 18px; }
.sync-dot { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--bar-muted); background: none; border: 0; padding: 4px; }
.sync-dot i { width: 7px; height: 7px; border-radius: 50%; background: #555; display: inline-block; }
.sync-dot[data-s="ok"] i { background: #3BC46F; } .sync-dot[data-s="err"] i { background: var(--red); } .sync-dot[data-s="busy"] i { background: #F2AE48; }

/* layout */
.layout { max-width: 760px; margin: 0 auto; padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
.layout.has-mini { padding-bottom: calc(215px + env(safe-area-inset-bottom, 0px)); }
.rail, .dock { display: none; }
main { padding: 18px var(--gut-r) 12px var(--gut-l); display: grid; gap: 20px; align-content: start; min-width: 0; }
main > * { min-width: 0; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
h1 { font-size: 22px; font-weight: 700; }
h2 { font-size: 17px; font-weight: 700; line-height: 1.4; }
h3 { font-size: 14.5px; font-weight: 700; }
.sub { color: var(--muted); font-size: 13px; line-height: 1.6; }
.eyebrow { font-family: var(--f-ui); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.block { display: grid; gap: 10px; min-width: 0; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 26px; padding-inline: 2px; }
.sec-head h3 { display: flex; align-items: center; gap: 8px; }
.sec-head .c { font-family: var(--f-ui); font-size: 12px; color: var(--muted); font-weight: 600; }
.link { background: none; border: 0; color: var(--red-ink); font-weight: 600; font-size: 13px; padding: 0; display: inline-flex; align-items: center; gap: 5px; }
.link .i { width: 15px; height: 15px; }
.card { background: var(--surface); border-radius: var(--r-m); padding: 14px; border: 1px solid var(--line); display: grid; gap: 12px; }
.list { background: var(--surface); border-radius: var(--r-m); border: 1px solid var(--line); overflow: hidden; }
.list > * + * { border-top: 1px solid var(--line); }
.empty { text-align: center; color: var(--muted); font-size: 13.5px; padding: 26px 16px; line-height: 1.8; }
.empty b { display: block; color: var(--ink); font-family: var(--f-display); font-size: 15px; margin-bottom: 2px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; border-radius: 99px; padding: 3px 9px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.red { background: var(--red-soft); color: var(--red-ink); }
.tag.dark { background: var(--ink); color: var(--surface); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }

/* hello card */
.hello { background: var(--bar); color: var(--bar-ink); border-radius: var(--r-m); padding: 18px; border: 1px solid var(--line); display: grid; gap: 4px; position: relative; overflow: hidden; }
.hello::after { content: ""; position: absolute; width: 180px; height: 180px; border-radius: 50%; border: 22px solid var(--red); opacity: .16; inset-inline-start: -60px; top: -70px; }
.hello .eyebrow { color: var(--bar-muted); }
.hello h1 { color: var(--bar-ink); font-size: 21px; }
.hello .sub { color: var(--bar-muted); }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; position: relative; z-index: 1; }
.stat { background: var(--bar-2); border-radius: var(--r-s); padding: 11px 10px; display: grid; gap: 2px; border: 0; color: inherit; text-align: start; }
.stat b { font-family: var(--f-ui); font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11.5px; color: var(--bar-muted); }

/* chips & buttons */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; align-items: center; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 13px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip .c { font-family: var(--f-ui); font-size: 11.5px; opacity: .7; margin-inline-start: 4px; }
.chip.red[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; }
.btn { border: 0; border-radius: var(--r-s); padding: 12px 16px; font-weight: 700; font-size: 14.5px; display: inline-flex; gap: 8px; align-items: center; justify-content: center; text-decoration: none; }
.btn.primary { background: var(--red); color: #fff; }
.btn.dark { background: var(--ink); color: var(--surface); }
.btn.ghost { background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
.btn.small { padding: 9px 12px; font-size: 13.5px; }
.btn.danger { color: var(--red-ink); }
.btn[disabled] { opacity: .5; cursor: default; }
.btn .i { width: 18px; height: 18px; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; color: var(--ink); flex: none; }
.icon-btn .i { width: 18px; height: 18px; }
.icon-btn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* quick add */
.quick { display: flex; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 6px; align-items: center; }
.quick input { flex: 1; min-width: 0; border: 0; background: none; padding: 9px 8px; outline: none; font-size: 15px; }
.quick button { width: 38px; height: 38px; border-radius: var(--r-s); border: 0; background: var(--red); color: #fff; display: grid; place-items: center; padding: 0; flex: none; }

/* task rows */
.task { display: flex; align-items: center; gap: 4px; padding: 6px 8px 6px 10px; min-height: 58px; transition: background .2s; }
.task .ck { width: 40px; height: 40px; background: none; border: 0; padding: 0; display: grid; place-items: center; flex: none; }
.task .ck span { width: 23px; height: 23px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; color: transparent; transition: background .15s, border-color .15s; }
.task .ck .i { width: 14px; height: 14px; stroke-width: 3; }
.task.pr1 .ck span { border-color: var(--warn); }
.task.pr2 .ck span { border-color: var(--red); background: var(--red-soft); }
.task .ck:hover span { color: var(--muted); }
.task.done .ck span { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.task .body { flex: 1; min-width: 0; background: none; border: 0; text-align: start; padding: 6px 2px; display: grid; gap: 4px; }
.task .t { font-weight: 600; font-size: 14.5px; line-height: 1.5; overflow-wrap: anywhere; }
.task.done .t { text-decoration: line-through; color: var(--muted); font-weight: 500; }
.task .m { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 12px; color: var(--muted); }
/* morning brief */
.bcard { display: flex; align-items: center; gap: 12px; text-align: start; background: var(--surface); border: 1.5px solid var(--red); border-radius: var(--r-m); padding: 12px 14px; color: var(--ink); width: 100%; }
.bcard .sun { font-size: 24px; } .bcard .s { color: var(--muted); font-size: 12.5px; } .bcard .i { color: var(--muted); }
.bback { justify-self: start; } .bback .i { transform: scaleX(-1); }
.bhello h1 { font-size: 24px; }
.bstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px; position: relative; z-index: 1; }
.bstats div { background: var(--bar-2); border-radius: 12px; padding: 10px; display: grid; gap: 2px; min-width: 0; }
.bstats b { font-size: 17px; font-weight: 800; white-space: nowrap; } .bstats .r b { color: var(--red); } .bstats span { font-size: 11px; color: var(--bar-muted); line-height: 1.35; }
.bbar { width: 6px; height: 18px; border-radius: 3px; background: var(--red); display: inline-block; }
.card.bl { padding: 4px 14px; gap: 0; } .card.btop { border: 2px solid var(--ink); }
.brow { display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
.brow:last-child { border-bottom: 0; }
.bck { width: 30px; height: 30px; flex: none; background: none; border: 0; padding: 0; display: grid; place-items: center; margin-top: -3px; }
.bck > span { width: 21px; height: 21px; border: 2px solid var(--ink); border-radius: 6px; display: grid; place-items: center; color: transparent; transition: background .15s; }
.bck .i { width: 14px; height: 14px; stroke-width: 3; }
.bck.off > span { border-style: dashed; border-color: var(--muted); }
.brow.done .bck > span { background: var(--ink); color: var(--surface); }
.bt { font-weight: 700; font-size: 14.5px; line-height: 1.55; overflow-wrap: anywhere; }
.bt .bn { color: var(--red); margin-inline-end: 6px; }
.brow.done .tx { text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: var(--red); color: var(--muted); font-weight: 500; }
.brow.done .bm, .brow.done .bchips { opacity: .5; }
.bm { color: var(--muted); font-size: 12.5px; margin-top: 2px; line-height: 1.55; }
.btag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; vertical-align: 1px; }
.btag.bad { background: var(--red); color: #fff; } .btag.warn { background: var(--red-soft); color: var(--red-ink); } .btag.info { background: var(--ink); color: var(--surface); } .btag.muted { background: var(--surface-2); color: var(--muted); }
.bchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.bchip { font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 99px; background: var(--surface-2); color: var(--ink); text-decoration: none; }
.bchip.wa { background: #E7F7EC; color: #0E7A39; }
.btbl { width: 100%; border-collapse: collapse; margin: 4px 0; }
.btbl td { padding: 9px 0; border-top: 1px solid var(--line); vertical-align: top; font-size: 13.5px; }
.btbl td.amt { font-weight: 800; text-align: center; white-space: nowrap; padding-inline: 8px; } .btbl td.amt.bad { color: var(--red); } .btbl td.amt.muted { color: var(--muted); }
.btbl td:last-child { text-align: end; }
.btotal { display: flex; justify-content: space-between; background: var(--ink); color: var(--surface); border-radius: 10px; padding: 10px 14px; margin: 6px 0 10px; font-weight: 700; }
.bslot { display: flex; gap: 14px; padding: 9px 0; border-bottom: 1px dashed var(--line); font-weight: 600; } .bslot:last-child { border: 0; } .bslot b { color: var(--red); min-width: 48px; direction: ltr; text-align: end; }
.bquote { background: var(--surface-2); border-inline-start: 4px solid var(--red); border-radius: 12px; padding: 14px 16px; font-weight: 600; line-height: 1.7; }
.task .m span { display: inline-flex; align-items: center; gap: 4px; }
.task .m .i { width: 13px; height: 13px; }
.task .m .late { color: var(--red-ink); font-weight: 700; }
.task .m .today { color: var(--ink); font-weight: 600; }
.pj i, .pdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 1px var(--line); flex: none; }
.task .go { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; color: var(--ink); flex: none; padding: 0; }
.task .go .i { width: 15px; height: 15px; }
.task .tog { height: 30px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; gap: 3px; padding: 0 8px 0 6px; font-family: var(--f-ui); font-size: 11.5px; font-weight: 700; color: var(--muted); flex: none; margin-inline-end: 4px; }
.task .tog .i { width: 14px; height: 14px; transition: transform .15s; }
.task .tog[aria-expanded="true"] .i { transform: rotate(90deg); }
.task.active { background: var(--red-soft); }
.task.active .go { background: var(--red); border-color: var(--red); color: #fff; }
.task.pop .ck span { animation: pop .35s ease-out; }
@keyframes pop { 50% { transform: scale(1.25); } }
.kids { margin-inline-start: 30px; border-inline-start: 2px solid var(--line); }
.kids > * + * { border-top: 1px solid var(--line); }
.kids .task { min-height: 50px; }
.kids .task .t { font-size: 14px; font-weight: 500; }

/* projects */
.pgrid { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 14px; display: grid; gap: 9px; text-align: start; width: 100%; }
.pcard .row b { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .cnt { font-size: 12px; font-weight: 700; background: var(--surface-2); border-radius: 99px; padding: 3px 9px; color: var(--muted); }
.pcard .pdot, .phead .pdot { width: 12px; height: 12px; }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--red); }
.stagebar { display: flex; gap: 3px; }
.stagebar i { flex: 1; height: 5px; border-radius: 99px; background: var(--surface-2); }
.stagebar i.on { background: var(--ink); }
.stagebar i.cur { background: var(--red); }
.addcard { border-style: dashed; background: none; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; min-height: 60px; }
.phead { display: grid; gap: 12px; }
.phead .row h1 { overflow-wrap: anywhere; }
.stages { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 1px 4px; }
.stages::-webkit-scrollbar { display: none; }
.stg { flex: none; display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px 6px 7px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.stg i { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-family: var(--f-ui); font-size: 10.5px; font-weight: 700; background: var(--surface-2); }
.stg.done { color: var(--ink); } .stg.done i { background: var(--ink); color: var(--surface); }
.stg.cur { background: var(--red); color: #fff; border-color: var(--red); } .stg.cur i { background: #fff; color: var(--red); }
.gbadge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--red-ink); background: var(--red-soft); border-radius: 99px; padding: 3px 9px; }
.ginfo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; font-size: 13px; }
.ginfo span { color: var(--muted); display: block; font-size: 11.5px; }
.ginfo b { font-weight: 600; }

/* timer */
.tp { display: grid; gap: 16px; justify-items: center; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 4px; gap: 2px; }
.seg button { border: 0; background: none; border-radius: 99px; padding: 8px 18px; font-weight: 700; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.ring-wrap { position: relative; width: min(290px, 74vw); aspect-ratio: 1; }
.ring { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.ring .trk { fill: none; stroke: var(--line); stroke-width: 9; }
.ring .prg { fill: none; stroke: var(--red); stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset .25s linear; filter: drop-shadow(0 0 6px var(--glow)); }
.ring.brk .prg { stroke: var(--ink); filter: none; }
.ring-c { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 6px; text-align: center; }
.ring-c .ph { font-family: var(--f-display); font-weight: 600; font-size: 14px; color: var(--muted); }
.ring-c .time { font-family: var(--f-ui); font-weight: 700; font-size: clamp(44px, 15vw, 64px); letter-spacing: -.02em; line-height: 1; direction: ltr; }
.cyc { display: flex; gap: 6px; direction: ltr; }
.cyc i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.cyc i.on { background: var(--red); }
.ctrl { display: flex; align-items: center; gap: 22px; }
.cb { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink); padding: 0; }
.cb.main { width: 76px; height: 76px; background: var(--red); border: 0; color: #fff; box-shadow: 0 8px 22px var(--glow); }
.cb.main .i { width: 30px; height: 30px; }
.ext { display: flex; gap: 8px; }
.ext .chip { font-family: var(--f-ui); }
.tpick { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 6px 6px 6px 8px; }
.tpick > button:first-child { flex: 1; min-width: 0; background: none; border: 0; text-align: start; padding: 6px; display: grid; gap: 2px; }
.tpick .l { font-size: 11.5px; color: var(--muted); }
.tpick b { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.presets { display: grid; gap: 12px; width: 100%; max-width: 420px; container-type: inline-size; }
/* duration presets: an even grid that always fits its column (label beside the chips, or above them when narrow) */
.pr-row { display: grid; grid-template-columns: 56px minmax(0, 1fr); align-items: center; gap: 10px; }
.pr-row > span { font-size: 12.5px; color: var(--muted); font-weight: 600; text-align: start; }
.pr-row .chips { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 6px; overflow: visible; padding: 0; }
.pr-row .chip { font-family: var(--f-ui); min-width: 0; padding: 8px 4px; text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 4px; overflow: hidden; text-overflow: ellipsis; }
.pr-row .chip.wide { grid-column: span 2; }
.pr-row .chip .i { width: 13px; height: 13px; flex: none; }
@container (max-width: 400px) { .pr-row { grid-template-columns: minmax(0, 1fr); gap: 6px; } }

/* mini player + floating add button (phone / tablet) */
.mini { position: fixed; z-index: 29; left: 50%; transform: translateX(-50%); width: min(728px, calc(100% - 20px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  background: var(--panel, var(--bar)); color: var(--bar-ink); border: 1px solid var(--bar-line, #333); border-radius: var(--r-m); padding: 8px 8px 8px 12px; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.28); cursor: pointer; }
.mini svg.ring { width: 40px; height: 40px; }
.mini .ring .trk { stroke: var(--bar-2); stroke-width: 14; } .mini .ring .prg { stroke-width: 14; }
.mini .ring.brk .prg { stroke: var(--bar-ink); }
.mini .time { font-family: var(--f-ui); font-weight: 700; font-size: 19px; direction: ltr; text-align: end; }
.mini .tt { font-size: 12px; color: var(--bar-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini .cb { width: 42px; height: 42px; background: var(--red); border: 0; color: #fff; }
.fab { position: fixed; z-index: 31; inset-inline-end: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 18px; background: var(--red); color: #fff; border: 0; display: grid; place-items: center; box-shadow: 0 8px 20px var(--glow); padding: 0; }
.fab .i { width: 26px; height: 26px; }
body.has-mini .fab { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }

/* bottom nav */
.nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px var(--gut-r) calc(8px + env(safe-area-inset-bottom, 0px)) var(--gut-l); }
.nav button { background: none; border: 0; display: grid; justify-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); padding: 4px 0; max-width: 140px; width: 100%; justify-self: center; }
.nav button[aria-current="page"] { color: var(--ink); }
.nav button[aria-current="page"] .i { color: var(--red); }

/* rail (desktop) */
.rail { flex-direction: column; gap: 3px; padding: 18px 12px; border-inline-end: 1px solid var(--line); }
.rail button.nv { display: flex; align-items: center; gap: 12px; background: none; border: 0; border-radius: var(--r-s); padding: 10px 12px; font-weight: 600; color: var(--muted); text-align: start; width: 100%; }
.rail button.nv:hover { background: var(--surface); }
.rail button.nv[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: inset -3px 0 0 var(--red); }
.rail button.nv[aria-current="page"] .i { color: var(--red); }
.rail .nv .c { margin-inline-start: auto; font-family: var(--f-ui); font-size: 11.5px; }
.rail .add { margin-bottom: 10px; }
.rail .rp { margin-top: 14px; display: grid; gap: 2px; }
.rail .rp .eyebrow { padding: 4px 12px; }
.rail .rp button { display: flex; align-items: center; gap: 10px; background: none; border: 0; border-radius: var(--r-s); padding: 7px 12px; font-size: 13.5px; color: var(--ink); text-align: start; width: 100%; }
.rail .rp button:hover { background: var(--surface); }
.rail .rp button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.rail .rp button[aria-current="page"] { background: var(--surface); font-weight: 700; }
.rail .kbd { margin-top: auto; font-size: 11.5px; color: var(--muted); line-height: 1.9; padding: 12px; }
kbd { font-family: var(--f-ui); font-size: 10.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; background: var(--surface); }
.dock { padding: 22px 18px; border-inline-start: 1px solid var(--line); background: var(--surface-2); }
.dock .tp { position: sticky; top: 90px; }
.dock .ring-wrap { width: 250px; }

/* habits */
.hpills { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.hpills::-webkit-scrollbar { display: none; }
.hpill { flex: none; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 13px 5px 5px; font-weight: 600; font-size: 13px; }
.hpill .r { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--hc); display: grid; place-items: center; color: var(--hc); font-family: var(--f-ui); font-size: 11px; font-weight: 700; }
.hpill .r .i { width: 15px; height: 15px; stroke-width: 3; }
.hpill.on .r { background: var(--hc); color: #fff; }
.hpill.on { color: var(--muted); }
.habit { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px 14px; display: grid; gap: 12px; }
.habit .hh { display: flex; align-items: center; gap: 12px; }
.habit .hh .body { flex: 1; min-width: 0; background: none; border: 0; text-align: start; padding: 0; display: grid; gap: 3px; }
.habit .hh b { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
.habit .hh .s { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.habit .hh .s .fire { color: var(--red-ink); font-weight: 700; }
.hbtn { width: 50px; height: 50px; border-radius: 50%; border: 2.5px solid var(--hc); background: none; display: grid; place-items: center; flex: none; font-family: var(--f-ui); font-weight: 700; font-size: 13px; color: var(--hc); padding: 0; }
.hbtn .i { width: 22px; height: 22px; stroke-width: 3; }
.hbtn.on { background: var(--hc); color: #fff; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.week button { border: 0; background: none; display: grid; justify-items: center; gap: 4px; font-size: 10.5px; color: var(--muted); padding: 0; }
.week button i { width: 100%; max-width: 34px; height: 26px; border-radius: 8px; background: var(--surface-2); display: block; }
.week button.part i { background: color-mix(in srgb, var(--hc) 40%, var(--surface-2)); }
.week button.on i { background: var(--hc); }
.week button.off i { background: none; border: 1px dashed var(--line); }
.week button.today span { color: var(--ink); font-weight: 700; }
.heat { display: grid; grid-template-rows: repeat(7, 13px); grid-auto-flow: column; grid-auto-columns: 13px; gap: 3px; direction: ltr; overflow-x: auto; justify-content: end; }
.heat i { border-radius: 3px; background: var(--surface-2); }
.heat i.on { background: var(--hc); }
.heat i.part { background: color-mix(in srgb, var(--hc) 45%, var(--surface-2)); }
.heat i.x { background: none; }

/* notes (Keep-style) */
.notes { columns: 2 160px; column-gap: 10px; }
.note-c { break-inside: avoid; margin: 0 0 10px; display: block; width: 100%; text-align: start; border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px 13px; background: var(--surface); color: var(--ink); }
.note-c h4 { font-size: 14.5px; font-weight: 700; margin-bottom: 6px; overflow-wrap: anywhere; }
.note-c .b { white-space: pre-wrap; font-size: 13.5px; line-height: 1.7; display: -webkit-box; -webkit-line-clamp: 10; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.note-c .li { display: flex; gap: 7px; align-items: flex-start; font-size: 13.5px; line-height: 1.6; margin-top: 2px; }
.note-c .li i { width: 13px; height: 13px; border: 1.5px solid var(--muted); border-radius: 3px; flex: none; margin-top: 4px; }
.note-c .li.done { color: var(--muted); text-decoration: line-through; }
.note-c .li.done i { background: var(--muted); }
.note-c .f { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; align-items: center; font-size: 11px; color: var(--muted); }
.nc-red { background: var(--nc-red) !important; border-color: transparent !important; }
.nc-amber { background: var(--nc-amber) !important; border-color: transparent !important; }
.nc-green { background: var(--nc-green) !important; border-color: transparent !important; }
.nc-blue { background: var(--nc-blue) !important; border-color: transparent !important; }
.nc-purple { background: var(--nc-purple) !important; border-color: transparent !important; }
.nc-gray { background: var(--nc-gray) !important; border-color: transparent !important; }
.take { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 6px 6px 6px 8px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
.take > button:first-child { flex: 1; text-align: start; background: none; border: 0; padding: 10px 8px; color: var(--muted); font-size: 15px; }
.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 10px 16px; outline: none; font-size: 14.5px; }
.inp.plain { border: 0; background: transparent; padding: 6px 2px; }
.inp.plain:focus { border: 0; }
.nitems { display: grid; gap: 2px; }
.nitem { display: flex; align-items: center; gap: 4px; }
.nitem input { flex: 1; min-width: 0; border: 0; background: none; padding: 8px 4px; outline: none; font-size: 15px; }
.nitem.done input { text-decoration: line-through; color: var(--muted); }
.nitem .ck { width: 34px; height: 34px; border: 0; background: none; display: grid; place-items: center; padding: 0; }
.nitem .ck span { width: 18px; height: 18px; border-radius: 4px; border: 2px solid var(--muted); display: grid; place-items: center; color: transparent; }
.nitem.done .ck span { background: var(--muted); color: var(--surface); }
.nitem .ck .i { width: 12px; height: 12px; stroke-width: 3; }
.nitem .x { width: 30px; height: 30px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; padding: 0; }
.nitem .x .i { width: 15px; height: 15px; }

/* stats */
.bars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; height: 170px; }
.bcol { display: grid; grid-template-rows: auto 1fr auto; gap: 6px; height: 100%; justify-items: center; }
.bcol .bv { font-size: 11px; color: var(--muted); font-weight: 600; min-height: 14px; }
.bcol .bt { width: 100%; max-width: 34px; display: flex; align-items: flex-end; height: 100%; }
.bcol .b { width: 100%; background: var(--ink); border-radius: 6px 6px 3px 3px; min-height: 3px; }
.bcol.today .b { background: var(--red); }
.bcol .bl { font-size: 11px; color: var(--muted); }
.bcol.today .bl { color: var(--ink); font-weight: 700; }
.hbar { display: grid; gap: 6px; }
.hbar .row span:last-child { font-size: 12.5px; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 14px; display: grid; gap: 2px; }
.kpi b { font-family: var(--f-ui); font-size: 24px; font-variant-numeric: tabular-nums; }
.kpi span { font-size: 12px; color: var(--muted); }
.srow { display: flex; align-items: center; gap: 10px; padding: 11px 14px; font-size: 13.5px; width: 100%; background: none; border: 0; text-align: start; }
.srow .s { color: var(--muted); font-size: 12px; }

/* sheets */
.sheet-wrap { position: fixed; inset: 0; z-index: 60; display: flex; justify-content: center; align-items: flex-end; background: var(--shade); }
.sheet { width: min(560px, 100%); max-height: 92%; background: var(--bg); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: up .22s ease-out; padding-bottom: env(safe-area-inset-bottom, 0px); }
@keyframes up { from { transform: translateY(30px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet, .task.pop .ck span { animation: none; } .ring .prg { transition: none; } }
.sh-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px 10px; }
.sh-head h2 { flex: 1; }
.sh-body { overflow-y: auto; padding: 6px 18px 18px; display: grid; gap: 16px; }
.sh-foot { display: flex; gap: 10px; padding: 12px 18px 14px; border-top: 1px solid var(--line); background: var(--surface); align-items: center; }
.sheet[class*="nc-"] .sh-foot { background: transparent; }
.fld { display: grid; gap: 7px; }
.fld > span { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.inp { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-s); padding: 11px 12px; font-size: 15px; outline: none; }
.inp:focus { border-color: var(--ink); }
textarea.inp { resize: vertical; line-height: 1.7; }
.inp.date { width: auto; padding: 6px 10px; font-family: var(--f-ui); font-size: 13px; }
.inp.big { font-size: 17px; font-weight: 600; }
.stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 3px; width: max-content; }
.stepper button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--surface-2); font-size: 18px; font-weight: 700; }
.stepper b { min-width: 34px; text-align: center; font-size: 15px; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.pickrow { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; padding: 12px 14px; text-align: start; }
.pickrow b { font-weight: 600; font-size: 14px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pickrow span { font-size: 12px; color: var(--muted); }
.toggle { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.toggle .grow b { display: block; font-size: 14px; font-weight: 600; }
.toggle .grow span { font-size: 12px; color: var(--muted); }
.sw-t { width: 46px; height: 28px; border-radius: 99px; border: 0; background: var(--line); position: relative; padding: 0; flex: none; transition: background .15s; }
.sw-t::after { content: ""; position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: right .15s; }
.sw-t[aria-pressed="true"] { background: var(--red); }
.sw-t[aria-pressed="true"]::after { right: 21px; }
.note { font-size: 12.5px; color: var(--muted); line-height: 1.8; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r-s); padding: 10px 12px; }
.note b { color: var(--ink); }

/* toast */
.toast { position: fixed; z-index: 90; left: 50%; transform: translateX(-50%); bottom: calc(160px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); border-radius: 99px; padding: 10px 10px 10px 18px; display: flex; align-items: center; gap: 12px; font-size: 13.5px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: calc(100% - 32px); }
.toast span { padding-inline-start: 8px; }
.toast button { background: var(--red); color: #fff; border: 0; border-radius: 99px; padding: 6px 12px; font-weight: 700; font-size: 12.5px; }
.busy { position: fixed; inset: 0; z-index: 95; background: rgba(0,0,0,.35); display: grid; place-items: center; }
.busy div { background: var(--surface); color: var(--ink); border-radius: var(--r-m); padding: 18px 22px; display: flex; gap: 12px; align-items: center; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--red); animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }

/* widget (floating window, ?widget=1 and picture-in-picture) */
.widget-body { background: var(--bg); }
.wg { padding: 12px; display: grid; gap: 10px; }
.wg-top { background: var(--panel, var(--bar)); color: var(--bar-ink); border: 1px solid var(--bar-line, #333); border-radius: var(--r-m); padding: 12px; display: flex; align-items: center; gap: 12px; border-bottom: 3px solid var(--red); }
.wg-top .ring-wrap { width: 78px; flex: none; }
.wg-top .ring .trk { stroke: var(--bar-2); stroke-width: 12; } .wg-top .ring .prg { stroke-width: 12; }
.wg-top .ring.brk .prg { stroke: var(--bar-ink); }
.wg-top .time { font-family: var(--f-ui); font-weight: 700; font-size: 30px; direction: ltr; text-align: end; line-height: 1.1; }
.wg-top .ph { font-size: 12px; color: var(--bar-muted); }
.wg-top .tt { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--bar-ink); }
.wg-btns { display: flex; gap: 6px; margin-top: 6px; }
.wg-btns button { height: 32px; min-width: 32px; border-radius: 99px; border: 1px solid var(--bar-line, #333); background: var(--bar-2); color: var(--bar-ink); display: grid; place-items: center; font-family: var(--f-ui); font-size: 12px; font-weight: 700; padding: 0 9px; }
.wg-btns button.main { background: var(--red); border-color: var(--red); color: #fff; }
.wg-btns .i { width: 15px; height: 15px; }
.wg .task { min-height: 46px; padding: 2px 6px; }
.wg .task .t { font-size: 13.5px; }
.wg .task .m, .wg .task .tog { display: none; }
.wg .quick { padding: 4px; }
.wg .quick input { font-size: 14px; padding: 7px; }
.wg .quick button { width: 32px; height: 32px; }
.wg .more { text-align: center; font-size: 12px; color: var(--muted); }

/* English (left-to-right) layout */
html[dir="ltr"] .rail button.nv[aria-current="page"] { box-shadow: inset 3px 0 0 var(--red); }
html[dir="ltr"] .sw-t::after { right: auto; left: 3px; transition: left .15s; }
html[dir="ltr"] .sw-t[aria-pressed="true"]::after { left: 21px; }
/* the user's own text keeps its own direction (Arabic stays right-to-left inside the English app and vice versa) */
.task .t, .note-c h4, .note-c .b, .note-c .li span, .pcard b, .habit .hh b, .phead h1, .pickrow b, .tpick b, .mini .tt, .wg-top .tt, .srow .grow, .hpill { unicode-bidi: plaintext; }
/* first-run setup & theme pickers */
.tpl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tpl button { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px; text-align: start; display: grid; gap: 3px; align-content: start; }
.tpl button .e { font-size: 22px; line-height: 1.2; }
.tpl button b { font-size: 14px; }
.tpl button span { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.tpl button[aria-pressed="true"] { border-color: var(--red); box-shadow: inset 0 0 0 1.5px var(--red); background: var(--red-soft); }
.styles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.styles button { border: 1px solid var(--line); border-radius: var(--r-m); padding: 8px; background: var(--surface); display: grid; gap: 6px; font-size: 12.5px; font-weight: 600; }
.styles button i { height: 30px; border-radius: 8px; display: block; border: 1px solid var(--line); }
.styles button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.sw.pick { position: relative; overflow: hidden; background: conic-gradient(#f44, #fd3, #4d4, #3cf, #46f, #d4f, #f44); }

        if (JSON.stringify(m.log) !== JSON.stringify(o.log || {}) || (cur.updatedAt || 0) > (o.updatedAt || 0)) { m.updatedAt = Math.max(now(), (o.updatedAt || 0) + 1); S.dirty[`habit:${o.id}`] = 1; }
        if (JSON.stringify(m) !== JSON.stringify(cur)) { putObj('habit', m); changed = true; }
        continue;
      }
      if (!cur || (o.updatedAt || 0) > (cur.updatedAt || 0)) { putObj(it.kind, o); changed = true; }
    }
    S.dev.since = j.now; S.dev.lastSync = now(); save(); setSyncState('ok');
    if (changed) render();
    if (manual) toast(L('اتزامن ✓'));
    if (Object.keys(S.dirty).length) scheduleSync(800);
  } catch (e) { setSyncState('err'); if (manual) toast(e.message === 'key' ? L('كلمة السر غلط') : L('مقدرتش أزامن — اتأكد من النت والرابط')); }
  finally { syncing = false; }
}

/* ---------- Graficoo Studio link: work projects come from the Graficoo app (same API its PWA uses) ---------- */
let gBusy = false;
async function gRpc(fn, args) {
  let r;
  try { r = await fetch(S.dev.gUrl || G_DEFAULT_URL, { method: 'POST', body: JSON.stringify({ fn, args }), redirect: 'follow', credentials: 'omit' }); }
  catch (e) { throw new Error(L('مفيش اتصال بالنت')); }
  const j = await r.json();
  if (!j || !j.ok) throw new Error((j && j.error) || L('مشكلة في سيرفر جرافيكوو'));
  return j.data;
}
async function gLogin(pin) {
  const d = await gRpc('login', [pin]);
  S.dev.gToken = d.token; S.dev.gName = d.name || ''; save();
  await gRefresh(true);
}
function applyGraficoo(list) {
  const seen = new Set(); let n = 0;
  for (const gp of list) {
    if (!gp || !gp.id) continue;
    const id = 'g-' + gp.id; seen.add(id);
    const closed = gp.stage === '7 - Delivered' || gp.stage === 'Cancelled';
    const cur = S.projects[id];
    if (!cur && closed) continue; // old finished jobs stay in Graficoo only
    const f = { source: 'graficoo', gid: String(gp.id), area: 'work', name: String(gp.desc || gp.id), client: String(gp.clientName || ''), delivery: String(gp.delivery || '').slice(0, 10), gstage: String(gp.stage || ''), service: String(gp.service || ''), closed };
    if (!cur) { S.projects[id] = { id, color: '#EE2E24', createdAt: now(), ...f }; touch('project', S.projects[id]); n++; continue; }
    if (Object.keys(f).some((k) => cur[k] !== f[k]) || cur.deleted) { Object.assign(cur, f); cur.deleted = false; touch('project', cur); n++; }
  }
  for (const p of Object.values(S.projects)) if (isG(p) && !seen.has(p.id) && !p.closed && !p.deleted) { p.closed = true; p.gone = true; touch('project', p); n++; }
  return n;
}
async function gRefresh(manual) {
  if (!CFG.graficoo || !S.dev.gToken || gBusy) return;
  gBusy = true;
  try {
    const d = await gRpc('refreshData', [S.dev.gToken]);
    const n = applyGraficoo(d.projects || []);
    S.dev.gLast = now(); save(); render();
    if (manual) toast(n ? `${L("اتحدّث من جرافيكوو")} (${n})` : L('مشاريع جرافيكوو محدّثة ✓'));
  } catch (e) {
    if (/AUTH/.test(e.message)) { S.dev.gToken = ''; save(); toast(L('جلسة جرافيكوو خلصت — اربط تاني من الإعدادات')); render(); }
    else if (manual) toast(e.message);
  } finally { gBusy = false; }
}
async function gAdvance(pid) {

  if (i < 0 || i >= G_STAGES.length - 1) return;

    const o = { ...gp, stage: nx[0] }; delete o.snap; delete o._local; o.quick = gp.quick ? 'yes' : '';
    await gRpc('saveProject', [S.dev.gToken, o, { log: `${L("اتنقل لـ «")}${nx[1]}${L("» (من")} Focus)` }]);
    p.gstage = nx[0]; p.closed = nx[0] === '7 - Delivered'; touch('project', p); render();
    toast(`${p.gid} ← ${nx[1]}`);
  } catch (e) {
    if (/AUTH/.test(e.message)) { S.dev.gToken = ''; save(); toast(L('جلسة جرافيكوو خلصت — اربط تاني')); } else toast(e.message);
  } finally { busy(false); }
}
let busyN = 0;
function busy(on, msg) {

const chip = (act, v, label, on, extra = '') => `<button type="button" class="chip ${extra}" data-act="${act}" data-v="${esc(v)}" aria-pressed="${!!on}">${label}</button>`;

/* a list that nests child tasks under their parent when both are in it */
function treeList(arr, opt = {}) {
  const ids = new Set(arr.map((t) => t.id)), kids = {};
  arr.forEach((t) => { if (t.parentId && ids.has(t.parentId)) (kids[t.parentId] ||= []).push(t); });
  const roots = arr.filter((t) => !(t.parentId && ids.has(t.parentId)));
  const row = (t) => {
    const allKids = kidsOf(t.id), shown = (kids[t.id] || []).sort((a, b) => (a.done - b.done) || ((a.createdAt || 0) - (b.createdAt || 0)));
    const open = !S.dev.collapsed[t.id];
    return taskRow(t, { ...opt, nest: true, kids: allKids, showParent: !!t.parentId }) + (shown.length && open ? `<div class="kids">${shown.map((k) => taskRow(k, { ...opt, noProject: true, kids: kidsOf(k.id) })).join('')}</div>` : '');

/* ---------- translating the user's own text (on request only) ---------- */
const hasArabic = (t) => /[؀-ۿ]/.test(t || '');
async function translateTexts(texts, to) {
  if (!S.dev.syncUrl) throw new Error(L('الترجمة بتشتغل من خلال المزامنة — اربطها من الإعدادات الأول'));
  const out = [];
  for (let i = 0; i < texts.length; i += 80) {
    let r;
    try { r = await fetch(S.dev.syncUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key: S.dev.syncKey, fn: 'translate', to, texts: texts.slice(i, i + 80) }) }); }
    catch (e) { throw new Error(L('مفيش اتصال بالنت')); }
    const j = await r.json();
    if (!j.ok || !Array.isArray(j.out)) throw new Error(j.err === 'key' ? L('كلمة السر غلط') : L('الترجمة مش متاحة دلوقتي — جرّب تاني'));
    out.push(...j.out);
  }
  return out;
}
function addTranslateBtn() {
  const head = $('.sh-head'); if (!head) return;
  const b = document.createElement('button');
  b.className = 'icon-btn'; b.dataset.act = 'tr-sheet'; b.innerHTML = I.globe;
  b.setAttribute('aria-label', L('ترجم للغة التانية')); b.title = L('ترجم للغة التانية');

}
async function translateSheet() {
  const fields = [...document.querySelectorAll('.sheet #f-title, .sheet #f-notes, .sheet [data-kid], .sheet #f-pname, .sheet #f-pstages, .sheet #f-hname, .sheet #n-title, .sheet #n-body, .sheet [data-ni]')].filter((e) => e.value.trim());
  if (!fields.length) return toast(L('مفيش كلام أترجمه'));
  const ar = fields.filter((e) => hasArabic(e.value)).length, to = ar * 2 >= fields.length ? 'en' : 'ar';
  busy(true, L('بيترجم…'));
  try {
    const out = await translateTexts(fields.map((e) => e.value), to);
    fields.forEach((e, i) => { if (out[i]) { e.value = out[i]; e.dispatchEvent(new Event('input', { bubbles: true })); } });
    toast(to === 'en' ? L('اتترجم للإنجليزي — راجعه واحفظ') : L('اتترجم للعربي — راجعه واحفظ'));
  } catch (e) { toast(e.message); } finally { busy(false); }
}
/* every text the user wrote, as [object kind, object, field, (index)] */
function userTexts() {
  const out = [];
  for (const t of tasks()) { out.push(['task', t, 'title']); if (t.notes) out.push(['task', t, 'notes']); }
  for (const p of projects()) if (!isG(p)) { out.push(['project', p, 'name']); (p.stages || []).forEach((_, i) => out.push(['project', p, 'stages', i])); }
  for (const h of habits()) out.push(['habit', h, 'name']);
  for (const n of notes()) { if (n.title) out.push(['note', n, 'title']); if (n.body) out.push(['note', n, 'body']); (n.items || []).forEach((_, i) => out.push(['note', n, 'items', i])); }
  return out;
}
const getT = ([, o, f, i]) => (i === undefined ? o[f] : f === 'items' ? o.items[i].t : o[f][i]) || '';
const setT = ([, o, f, i], v) => { if (i === undefined) o[f] = v; else if (f === 'items') o.items[i].t = v; else o[f][i] = v; };
async function translateAll(to) {
  const all = userTexts().filter((x) => getT(x).trim() && (to === 'en' ? hasArabic(getT(x)) : !hasArabic(getT(x))));
  if (!all.length) return toast(to === 'en' ? L('كل اللي كتبته إنجليزي أصلاً') : L('كل اللي كتبته عربي أصلاً'));
  if (!confirm(`${L('هترجم')} ${all.length} ${L('حاجة كتبتها')} ${to === 'en' ? L('للإنجليزي') : L('للعربي')}. ${L('تقدر ترجع زي ما كانت من «تراجع».')}`)) return;
  busy(true, `${L('بيترجم')} ${all.length}…`);
  try {
    const out = await translateTexts(all.map(getT), to);
    const touched = new Map();
    all.forEach((x) => { if (!touched.has(x[1])) touched.set(x[1], [x[0], JSON.stringify(x[1])]); });
    try { localStorage.setItem('focus.pretranslate', JSON.stringify([...touched.values()])); } catch (e) {}
    all.forEach((x, i) => { if (out[i]) setT(x, out[i]); });
    for (const [o, [kind]] of touched) touch(kind, o);
    closeSheet(); render();
    toast(`${L('اتترجم')} ${all.length} ✓`, undoTranslate);
  } catch (e) { toast(e.message); } finally { busy(false); }
}
function undoTranslate() {
  let snap = []; try { snap = JSON.parse(localStorage.getItem('focus.pretranslate') || '[]'); } catch (e) {}
  for (const [kind, j] of snap) { const o = JSON.parse(j); putObj(kind, o); touch(kind, getObj(kind, o.id)); }
  try { localStorage.removeItem('focus.pretranslate'); } catch (e) {}
  render(); toast(L('رجعت زي ما كانت ✓'));
}

/* ---------- widget: Document PiP (desktop) → floating canvas video (mobile) → popup ---------- */
let pipWin = null, vpip = null;
async function openWidget() {
  if (WIDGET_MODE) return;
  if ('documentPictureInPicture' in window) {
    try {
      if (pipWin && !pipWin.closed) { pipWin.focus(); return; }
      const w = await documentPictureInPicture.requestWindow({ width: 340, height: 520 });
      pipWin = w;
      document.querySelectorAll('style, link[rel="stylesheet"]').forEach((n) => w.document.head.appendChild(n.cloneNode(true)));
      w.document.documentElement.lang = 'ar'; w.document.documentElement.dir = 'rtl';
      w.document.title = 'Focus';
      w.document.body.className = 'widget-body';
      w.document.body.innerHTML = '<div id="wgRoot"></div>';
      w.document.addEventListener('click', onClick);
      w.document.addEventListener('submit', onSubmit);
      w.addEventListener('pagehide', () => { pipWin = null; });
      render(); return;
    } catch (e) {}
  }
  if (matchMedia('(pointer:coarse)').matches && document.pictureInPictureEnabled) { if (await openVideoPip()) return; }
  const pw = window.open('./?widget=1', 'focus-widget', 'popup,width=360,height=580');
  if (!pw) toast(L('المتصفح منع الشباك الصغير — اسمح بالـ popups'));
}
async function openVideoPip() {
  try {
    if (vpip) { await vpip.v.requestPictureInPicture(); return true; }
    const c = document.createElement('canvas'); c.width = 480; c.height = 270;
    const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.setAttribute('playsinline', '');
    v.style.cssText = 'position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;bottom:0;left:0';
    document.body.appendChild(v);
    vpip = { c, ctx: c.getContext('2d'), v };
    drawVpip();
    v.srcObject = c.captureStream(4);
    vpip.iv = setInterval(drawVpip, 500);
    await v.play(); await v.requestPictureInPicture();
    v.addEventListener('leavepictureinpicture', () => { clearInterval(vpip.iv); v.remove(); vpip = null; });
    return true;
  } catch (e) { if (vpip) { clearInterval(vpip.iv); vpip.v.remove(); vpip = null; } toast(L('التايمر العائم مش مدعوم على الجهاز ده')); return true; }
}
function drawVpip() {
  if (!vpip) return;
  const { ctx } = vpip, t = T(), rem = remaining(t), p = t.dur ? Math.min(1, 1 - rem / t.dur) : 0, task = S.tasks[t.taskId];
  ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, 480, 270);
  ctx.fillStyle = '#EE2E24'; ctx.fillRect(0, 264, 480, 6);

  ctx.lineWidth = 12; ctx.lineCap = 'round';
  ctx.strokeStyle = '#2a2a2a'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = isBreak(t) ? '#ffffff' : '#EE2E24'; ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2 + p * Math.PI * 2, Math.PI * 1.5); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.direction = 'ltr';
  ctx.font = '700 84px Montserrat, system-ui, sans-serif'; ctx.fillText(fmt(rem), 28, 140);
  ctx.direction = 'rtl'; ctx.textAlign = 'right'; ctx.fillStyle = '#9A9A9E';
  ctx.font = '600 24px "IBM Plex Sans Arabic", system-ui, sans-serif';
  ctx.fillText(`${phaseName(t)}${t.running ? '' : L(' · متوقف')}`, 300, 196);
  if (task) { ctx.fillStyle = '#fff'; ctx.fillText(task.title.length > 26 ? task.title.slice(0, 25) + '…' : task.title, 300, 232); }
}

});
document.addEventListener('change', (e) => {
  if (e.target.id === 'f-accent' && /^#[0-9a-f]{6}$/i.test(e.target.value)) { S.pref.accent = e.target.value; touch('pref', S.pref); applyAccent(); refreshSettings(); }
  if (e.target.id === 'f-date' && D) { D.due = e.target.value || null; $('[data-grp="due"]').querySelectorAll('.chip').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === (D.due || '')))); }
  if (e.target.id === 'f-proj' && D) { D.projectId = e.target.value || null; const p = S.projects[D.projectId]; D.stage = p ? stageIdx(p) : null; $('#f-stage').innerHTML = stageChips(); $('#f-stage-wrap').hidden = !p; }
});
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase(), typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
  if (e.key === 'Escape' && sheetOpen()) { closeSheet(); return; }
  if (typing) {
    if (e.key === 'Enter' && e.target.id === 'f-title') { e.preventDefault(); saveTask(false); }
    else if (e.key === 'Enter' && e.target.id === 'f-pname') { e.preventDefault(); saveProject(); }
    else if (e.key === 'Enter' && e.target.id === 'f-hname') { e.preventDefault(); saveHabit(); }
    else if (e.key === 'Enter' && e.target.dataset.ni) { e.preventDefault(); $('#n-item')?.focus(); }
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === 'Space' && !sheetOpen()) { e.preventDefault(); toggleT(); }
  else if ((e.key === 'n' || e.key === 'N' || e.key === 'ى') && !sheetOpen()) { e.preventDefault(); fabAction(); }
});

/* tick, cross-tab, lifecycle */
setInterval(() => { const t = T(); if (t.running && now() >= t.endAt) complete(); else renderTimerBits(); }, 250);
window.addEventListener('storage', (e) => { if (e.key === LS && e.newValue) { const keepD = D; S = load(); D = keepD; if (!sheetOpen()) render(); } });
document.addEventListener('visibilitychange', () => {
  const t = T();
  if (document.visibilityState === 'visible') { closeRunNote(); wake(); syncNow(); if (now() - (S.dev.gLast || 0) > 5 * 60000) gRefresh(); if (!sheetOpen()) render(); }
  else if (t.running) notify(`${phaseName(t)} ${L("شغال")}`, `${S.tasks[t.taskId] ? S.tasks[t.taskId].title + ' · ' : ''}${L("هيخلص الساعة")} ${clock(t.endAt)}`, 'focus-run', true);
});
let lastWide = isWide();
window.addEventListener('resize', () => { if (isWide() !== lastWide) { lastWide = isWide(); render(); } });
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; });
setInterval(() => { if (document.visibilityState === 'visible') syncNow(); }, 60000);
setInterval(() => { if (document.visibilityState === 'visible') gRefresh(); }, 10 * 60000);
let lastDay = dkey();
setInterval(() => { if (dkey() !== lastDay) { lastDay = dkey(); if (!sheetOpen()) render(); } }, 30000);
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});

/* boot */
document.querySelectorAll('#top [aria-label], #top [title]').forEach((e) => { if (e.getAttribute('aria-label')) e.setAttribute('aria-label', L(e.getAttribute('aria-label'))); if (e.title) e.title = L(e.title); });
$('#statsBtn').innerHTML = I.chart; $('#widgetBtn').innerHTML = I.widget; $('#setBtn').innerHTML = I.gear; $('#fab').innerHTML = I.plus;
if (WIDGET_MODE) {
  document.body.classList.add('widget-body');
  ['#top', '#layout', '#nav', '#mini', '#fab'].forEach((s) => { $(s).hidden = true; $(s).style.display = 'none'; });
  $('#wgRoot').hidden = false;
} else {
  const st = +params.get('start');
  if (st > 0) { const t = T(); logPartial(); t.mode = 'pomo'; S.pref.focus = Math.min(600, st); touch('pref', S.pref); setPhase('focus', true); view = 'timer'; }
  if (params.has('new')) setTimeout(() => taskSheet(null, params.get('new') ? { title: params.get('new').slice(0, 200), due: /^\d{4}-\d{2}-\d{2}$/.test(params.get('due') || '') ? params.get('due') : dkey() } : undefined), 100);
  if (params.get('brief') && CFG.graficoo) { view = 'brief'; briefDay = /^\d{4}-\d{2}-\d{2}$/.test(params.get('brief')) ? params.get('brief') : null; }
  if (params.has('brief')) history.replaceState(null, '', location.pathname);
  if (params.has('start') || params.has('new')) history.replaceState(null, '', location.pathname);
  // one-tap setup on a new device: …/#sync=<apps script url>&key=<secret> (the hash never reaches the web server)
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('sync')) history.replaceState(null, '', location.pathname);
  // never connect silently: a link made by someone else would send this device's data to their script
  if (h.get('sync') && /^https:\/\/script\.google(usercontent)?\.com\//.test(h.get('sync')) && h.get('sync') !== S.dev.syncUrl
      && confirm(`${L('تربط المزامنة على الجهاز ده بالرابط ده؟')}

${h.get('sync')}

${L('كل بياناتك هتتبعت للرابط ده. وافق بس لو انت اللي عامل الرابط ده من حسابك.')}`)) {
    S.dev.since = 0; for (const [kind, c] of COLLS) for (const id in S[c]) S.dirty[`${kind}:${id}`] = 1;
    S.dev.syncUrl = h.get('sync'); S.dev.syncKey = h.get('key') || ''; save();
    setTimeout(() => toast(L('المزامنة اتربطت على الجهاز ده ✓')), 300);
  }
}
$('#brandSub').textContent = CFG.brandSub || '';
$('#brandSub').hidden = !CFG.brandSub;
if (CFG.iconSets) { $('#brandImg').hidden = true; $('#brandMk').hidden = false; }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme());
save();
render();
syncNow();
gRefresh();
if (CFG.onboarding && !S.pref.setupDone && !WIDGET_MODE) setTimeout(() => onboardSheet(), 250);
</script>
</body>
</html>
